version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
    time: "08:30"
    timezone: America/Los_Angeles
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    babel:
      patterns:
      - "@babel/*"
      update-types:
      - minor
      - patch
    eslint-typescript:
      patterns:
      - "@eslint/*"
      - "@typescript-eslint/*"
      - "eslint"
      - "eslint-*"
      - "typescript"
      update-types:
      - minor
      - patch
    cypress:
      patterns:
      - "cypress"
      - "cypress-*"
      - "@cypress/*"
      update-types:
      - minor
      - patch
